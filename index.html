            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {

## ReAct-Loop: Überlegung, Aktion, Beobachtung

<img src="figs/react-loop.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**ReAct** (Reasoning and Acting): Das Modell wechselt zwischen Überlegen und Handeln, bis die Aufgabe erledigt ist 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Jede **Aktion** ist ein Werkzeugaufruf, in der Shell ein Befehl; jede **Beobachtung** ist dessen Ausgabe als Text 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Ihre Funktionen werden zu Werkzeugen des Agenten: Parameter, Ausgabe und Fehlermeldungen sind seine Schnittstelle
</div>

## ReAct-Loop in PowerShell

```powershell
$chat = @(@{ role = 'system'; content = $rules },
          @{ role = 'user'; content = $task })
do {
    $api.Body = @{ model = $model; messages = $chat } |
        ConvertTo-Json -Depth 4
    $reply = (Invoke-RestMethod @api).choices[0].message.content
    $chat += @{ role = 'assistant'; content = $reply }
    $action = if ($reply -match 'Aktion: (.+)') { $Matches[1] }
    if ($action -and (Read-Host "Ausführen? $action") -eq 'j') {
        $seen = try { & ([scriptblock]::Create($action)) *>&1 |
                      Out-String } catch { "$_" }
        $chat += @{ role = 'user'; content = "Beobachtung: $seen" }
    } else { $action = $null }
} while ($action)
$reply
```

<div class="warn fragment" data-fragment-index="1">

Der Befehl kommt vom Modell und läuft mit Ihren Rechten: deshalb die Rückfrage vor jeder Aktion.

</div>
</div>

</script></section><section data-separator="?

## Skriptblock als Objekt

```powershell
$format = { param($Device, $Value) "$Device = $Value" }

$format.GetType().Name                    # ScriptBlock
& $format 'G-1042' 1234                   # G-1042 = 1234
& $format -Value 1234 -Device 'G-1042'    # G-1042 = 1234

$fromText = [scriptblock]::Create('param($a) $a * 2')
& $fromText 21                            # 42
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`{ … }` ist ein Objekt: speichern, als Argument übergeben, später aufrufen 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`&` bindet Parameter auch über den Namen, `Invoke-Command -ArgumentList` nur nach Position 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Die Blöcke von `if`, `for` und `foreach` sind keine Skriptblöcke und öffnen keinen Scope 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->`[scriptblock]::Create()` parst Text: bei fremder Eingabe dasselbe Risiko wie `Invoke-Expression`
</div>

</script></section><section data-separator="?

## Kultur bei Casts und Cmdlets

```powershell
[cultureinfo]::CurrentCulture = 'de-DE'
[double]'1234,56'                 # Wert aus einer Messwertdatei
([datetime]'03/04/2026').Month    # Cast
(Get-Date '03/04/2026').Month     # Cmdlet
```

<div class="fragment" data-fragment-index="1">

```text
123456
3
4
```

</div>

<div class="merk fragment" data-fragment-index="2">

Casts und Operatoren wandeln kulturinvariant um: Punkt als Dezimaltrennzeichen, Datum als `MM/dd/yyyy`. Kompilierte Cmdlets binden ihre Parameter mit der Kultur der Sitzung.

</div>

<div class="warn fragment" data-fragment-index="3">

`[double]'1234,56'` meldet keinen Fehler: Das Komma gilt als Tausendertrennzeichen.

</div>

<div class="quelle fragment" data-fragment-index="4">

Quelle: Microsoft Learn, about_Type_Conversion

</div>
</div>

## `&` und Dot-Sourcing

```powershell
$limit = 100

& { $limit = 200 }     # Aufrufoperator: neuer Scope
$limit                 # 100

. { $limit = 300 }     # Dot-Sourcing: aktueller Scope
$limit                 # 300
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`&` führt Skriptblock, Funktion oder Skript in einem neuen Kind-Scope aus 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`. ` (Punkt, Leerzeichen) führt im aktuellen Scope aus: Definitionen bleiben 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`&` parst keinen Text: `& 'Get-Item logs'` sucht einen Befehl mit diesem Namen
</div>

</script></section><section data-separator="?

## Scope beim Lesen und Schreiben

```powershell
$count = 0
function Add-Count { $count++; "innen: $count" }

"$(Add-Count), $(Add-Count), außen: $count"
```

<div class="fragment" data-fragment-index="1">

```text
innen: 1, innen: 1, außen: 0
```

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Lesen sucht vom aktuellen Scope aufwärts bis zum globalen Scope 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Eine Zuweisung legt eine lokale Variable an, der Eltern-Scope bleibt unverändert 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->`$script:count++` schreibt in den Skript-Scope, `$global:` in den globalen 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->`$private:` verbirgt eine Variable vor Kind-Scopes 

<div class="warn fragment" data-fragment-index="6">

Eine nicht initialisierte Variable kann einen Wert aus dem Eltern-Scope erben. Setzen Sie Zähler und Sammelvariablen in Funktionen ausdrücklich auf einen Anfangswert.

</div>
</div>

## `begin`, `process`, `end` und `clean`

```powershell
$sum = {
    begin   { $total = 0 }
    process { $total += $_ }
    end     { "Summe: $total" }
}
1236, 1239, 1241 | & $sum       # Summe: 3716
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`begin`: einmal vor dem ersten Objekt 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`process`: einmal je Pipeline-Objekt, das aktuelle Objekt steht in `$_` 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`end`: einmal nach dem letzten Objekt 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->`clean` (ab 7.3): läuft zum Schluss immer, auch nach einem Fehler 

<div class="warn fragment" data-fragment-index="5">

In 5.1: `clean` ist ein Parserfehler. Aufräumen gehört dort in `try`/`finally`.

</div>
</div>

    "Prüfe $DeviceId"

## `Invoke()` und `InvokeReturnAsIs()`

```powershell
$pair = { 1, 2 }

$pair.Invoke().GetType().Name             # Collection`1
$pair.InvokeReturnAsIs().GetType().Name   # Object[]
(& $pair).GetType().Name                  # Object[]
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`Invoke()` liefert immer eine `Collection<PSObject>`, auch bei einem einzelnen Wert 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`InvokeReturnAsIs()` gibt das Ergebnis unverpackt zurück 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Im Skript ist `& $block` der normale Weg; die Methoden begegnen Ihnen in Klassen und bei Aufrufen aus .NET
</div>

## `GetNewClosure()`

```powershell
$threshold = 1000
$isHigh = { param($value) $value -gt $threshold }.GetNewClosure()

$threshold = 2000
& $isHigh 1500                                    # True
& { param($value) $value -gt $threshold } 1500    # False
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Die Closure kopiert die lokalen Variablen im Moment von `GetNewClosure()` 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Hashtables und Listen bleiben Referenzen: Änderungen am Objekt sind sichtbar 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Typischer Einsatz: Skriptblöcke aus einer Schleife mit je eigenem Wert 

<div class="warn fragment" data-fragment-index="4">

Die Closure hängt an einem dynamischen Modul. Eine Funktion aus dem Skript-Scope findet sie nicht (`CommandNotFoundException`), eine global definierte schon.

</div>
</div>

## Delay-Bind-Skriptblöcke

```powershell
Get-ChildItem .\messwerte\*.csv |
    Rename-Item -NewName { $_.BaseName + '.alt' } -WhatIf
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Delay-Bind**: ein Skriptblock als Argument eines Parameters, der keinen Skriptblock erwartet; PowerShell wertet ihn je Eingabeobjekt aus und bindet das Ergebnis 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Der Skriptblock läuft je Pipeline-Objekt, `$_` ist das aktuelle Objekt 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Der Parameter nimmt Pipeline-Eingabe an und ist weder `[scriptblock]` noch `[object]` 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Der Parametername steht ausdrücklich im Aufruf 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Ohne Pipeline-Eingabe: Fehler `ScriptBlockArgumentNoInput` 

<div class="quelle fragment" data-fragment-index="6">

Quelle: Microsoft Learn, about_Script_Blocks

</div>
</div>

</script></section><section data-separator="?

## `return`, `break` und `continue` in `ForEach-Object`

```powershell
1..3 | ForEach-Object { if ($_ -eq 2) { return }; $_ }
```

<div class="fragment" data-fragment-index="1">

```text
1
3
```

</div>

<div class="fragment" data-fragment-index="2">

```powershell
foreach ($site in 'Nord', 'Sued') {
    1..3 | ForEach-Object { if ($_ -eq 2) { continue }; "$site $_" }
}
```

</div>

<div class="fragment" data-fragment-index="3">

```text
Nord 1
Sued 1
```

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Der Rumpf ist ein Skriptblock: `return` beendet ihn für das aktuelle Objekt 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->`break` und `continue` wirken auf die umgebende Schleife und beenden die Pipeline 
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Ohne umgebende Schleife endet das ganze Skript
</div>

</script></section><section data-separator="?

## `return` und Ausgabe

```powershell
function Get-Sum {
    param([double[]]$Value)
    'Starte Berechnung'
    $sum = ($Value | Measure-Object -Sum).Sum
    return $sum
}
$result = Get-Sum -Value 1234, 1236
$result.Count
```

<div class="fragment" data-fragment-index="1">

```text
2
```

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Jede Anweisung mit Ausgabe landet im Ergebnis, `return` beendet nur 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Statusmeldungen gehören nach `Write-Verbose` oder `Write-Information` 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Ungewollte Ausgabe verwerfen: `$null = …` oder `[void]…` 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->In Klassenmethoden zählt nur, was hinter `return` steht
</div>

</script></section><section data-separator="?

## Einfache und Advanced Functions

```powershell
function Get-Reading {
    [CmdletBinding()]
    param([string]$DeviceId)

    Write-Verbose "Lese $DeviceId"
    "Gerät $DeviceId"
}

Get-Reading G-1042 -Verbose   # VERBOSE: Lese G-1042, dann Gerät G-1042
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Eine einfache Funktion hat nur `param(…)`: Überzählige Argumente landen still in `$args` 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`[CmdletBinding()]` oder ein `[Parameter()]`-Attribut macht die Funktion zur Advanced Function 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Dazu kommen die Common Parameters (`-Verbose`, `-ErrorAction`, …) und `$PSCmdlet` 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Überzählige Argumente sind ein Fehler, `$args` gibt es nicht mehr 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Ein Array für einen `[string]`-Parameter wird abgelehnt statt still verbunden
</div>

</script></section><section data-separator="?

## Parameter-Attribute

```powershell
function Get-Reading {
    [CmdletBinding()]
    param(
        [Parameter(Mandatory, Position = 0)]
        [Alias('Id')]
        [string]$DeviceId,

        [Parameter(Position = 1)]
        [int]$Last = 4
    )
    "$DeviceId, letzte $Last Werte"
}
Get-Reading G-1042 8          # G-1042, letzte 8 Werte
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`Mandatory`: Fehlt der Wert, fragt PowerShell an der Konsole nach 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`Position`: Aufruf ohne Parameternamen in fester Reihenfolge, hier erst das Gerät, dann die Anzahl 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`[Alias()]`: zweiter Name wie `-Id`, gilt auch für die Bindung aus der Pipeline
</div>

## Validierungsattribute

```powershell
param(
    [ValidatePattern('^G-\d{4}$')]
    [string]$DeviceId,
    [ValidateSet('OK', 'Ersatzwert', 'Gestoert')]
    [string]$Status = 'OK',
    [ValidateRange(1, 96)]
    [int]$Last = 4,
    [ValidateScript({ Test-Path $_ })]
    [string]$Path
)
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Die Prüfung läuft bei der Parameterbindung, vor der ersten Zeile des Rumpfs 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`ValidateSet` liefert zusätzlich die Tab-Vervollständigung 

<div class="warn fragment" data-fragment-index="3">

Die Attribute prüfen jede Zuweisung an die Variable, auch im Rumpf: `$Status = 'Unbekannt'` wirft dort einen Fehler. In 5.1 kennt `ValidateScript` kein `ErrorMessage` (erst ab PowerShell 6).

</div>

## Pipeline-Eingabe by value und by property name

```powershell
function Get-LogInfo {
    [CmdletBinding()]
    param(
        [Parameter(Mandatory, ValueFromPipeline,
                   ValueFromPipelineByPropertyName)]
        [Alias('FullName')]
        [string[]]$Path
    )
    process {
        foreach ($item in $Path) { "Lese $item" }
    }
}
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**By value**: das ganze Objekt, wenn sein Typ zum Parameter passt 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**By property name**: die Eigenschaft, die heißt wie der Parameter oder einer seiner Aliase 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`foreach` im `process`-Block deckt auch den Aufruf `-Path a.log, b.log` ab
</div>

## `ShouldProcess` für `-WhatIf` und `-Confirm`

```powershell
function Remove-OldLog {
    [CmdletBinding(SupportsShouldProcess)]
    param([Parameter(Mandatory)][string]$Path)

    foreach ($file in Get-ChildItem -Path $Path -Filter *.log) {
        if ($PSCmdlet.ShouldProcess($file.Name, 'Löschen')) {
            Remove-Item -Path $file.FullName
        }
    }
}
Remove-OldLog -Path .\archiv -WhatIf
```

<div class="fragment" data-fragment-index="1">

```text
What if: Performing the operation "Löschen" on target "import-service_2026-11-20.log".
```

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`SupportsShouldProcess` ergänzt die Parameter `-WhatIf` und `-Confirm` 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`ShouldProcess()` liefert bei `-WhatIf` `$false` und schreibt die Meldung 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Ohne Schalter liefert es `$true`; mit `-Confirm` fragt die Konsole vor jedem Eingriff nach
</div>

</script></section><section data-separator="?

## `ConfirmImpact` und Weitergabe von `-WhatIf`

| Einstellung | Standard | Bedeutung |
|---|---|---|
| `ConfirmImpact` der Funktion | `Medium` | Einstufung des Eingriffs |
| `$ConfirmPreference` der Sitzung | `High` | Schwelle für die Rückfrage |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Rückfrage ohne `-Confirm` erst, wenn `ConfirmImpact` die Schwelle erreicht 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->In der Funktion: `-WhatIf` setzt `$WhatIfPreference`, `-Confirm` senkt `$ConfirmPreference` auf `Low` 

<div class="fragment" data-fragment-index="3">

```powershell
Remove-Item -Path $file.FullName -WhatIf:$WhatIfPreference
```

</div>

<div class="warn fragment" data-fragment-index="4">

Ruft ein Skript oder ein Modul eine Funktion aus einem anderen Skriptmodul auf, kommen `$WhatIfPreference` und `$ConfirmPreference` dort nicht an. Reichen Sie `-WhatIf` ausdrücklich weiter.

</div>

## Skriptdatei mit `param` und `[CmdletBinding()]`

```powershell
#Requires -Version 5.1
[CmdletBinding()]
param(
    [Parameter(Mandatory)][string]$Path,
    [int]$Interval = 15
)
Write-Verbose "Lese $Path"
"Intervall: $Interval"
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`param` ist die erste Anweisung: Davor stehen nur Kommentare, `#Requires` und `using`-Anweisungen 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`[CmdletBinding()]` gibt dem Skript die Common Parameters wie `-Verbose` 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Start mit Pfad: `.\report.ps1 -Path .\messwerte -Verbose` 

<div class="merk fragment" data-fragment-index="4">

Unter Windows entscheidet die Ausführungsrichtlinie, ob eine Skriptdatei startet. Eingetippte Befehle betrifft sie nicht.

## `#Requires`

```powershell
#Requires -Version 7.4
#Requires -PSEdition Core
#Requires -Modules @{ ModuleName = 'Pester'; ModuleVersion = '5.5' }
#Requires -RunAsAdministrator
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Gilt für das ganze Skript und wird vor dem Start geprüft, egal in welcher Zeile 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Nicht erfüllt: Das Skript läuft nicht an (etwa `ScriptRequiresUnmatchedPSVersion`) 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`-PSEdition`: `Desktop` ist Windows PowerShell 5.1, `Core` ist PowerShell 6 und neuer 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->`RequiredVersion` vergleicht exakt: `'0.12'` passt nicht auf `'0.12.0'`

```powershell
# tools\helper.ps1
function Get-ConfigPath {
    Join-Path $PSScriptRoot 'settings.json'
}

# main.ps1
. "$PSScriptRoot\tools\helper.ps1"
Get-ConfigPath                # …\tools\settings.json
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`$PSScriptRoot`: Ordner der Datei, in der der Code steht 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`$PSCommandPath`: voller Pfad dieser Datei 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Beide hängen nicht vom aktuellen Verzeichnis ab 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->`$MyInvocation.PSScriptRoot`: Ordner der aufrufenden Datei

## `exit` und `$LASTEXITCODE`

| | `return` | `exit` |
|---|---|---|
| verlässt | Funktion, Skript oder Skriptblock | das Skript; an der Konsole die Sitzung |
| Wert | geht in die Ausgabe | Exitcode in `$LASTEXITCODE` |

<div class="fragment" data-fragment-index="1">

```powershell
# check.ps1:  'vor exit'; exit 3; 'nie erreicht'
& .\check.ps1
"weiter, Exitcode $LASTEXITCODE"       # weiter, Exitcode 3
pwsh -NoProfile -File .\check.ps1      # Prozess endet mit Code 3
```

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Ein mit `&` gestartetes Skript mit `exit` beendet den Aufrufer nicht 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Ohne `exit` liefert `pwsh -File` 0 bei Erfolg und 1 bei einer unbehandelten Ausnahme 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->`finally` läuft auch bei `exit`
</div>

## Skriptmodul mit `.psm1` und `Export-ModuleMember`

```powershell
# LogTools\LogTools.psm1
function Get-LogEntry       { <# … #> }
function Get-LogSummary     { <# … #> }
function ConvertTo-LogLevel { <# Hilfsfunktion #> }

Export-ModuleMember -Function Get-LogEntry, Get-LogSummary
```

<div class="fragment" data-fragment-index="1">

```powershell
Import-Module .\LogTools\LogTools.psm1
Get-Command -Module LogTools        # Get-LogEntry, Get-LogSummary
```

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`Export-ModuleMember` legt die öffentliche Schnittstelle fest 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Ohne den Aufruf exportiert ein `.psm1` alle Funktionen und Aliase, aber keine Variablen 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Nach einer Änderung lädt `Import-Module -Force` das Modul neu

<img src="figs/ps-modul-scope.png" alt="" style="object-fit: scale-down">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Modulfunktionen laufen im Session-State des Moduls 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Dieser hängt am globalen Scope, neben der Scope-Kette des Aufrufers 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`$script:` im Modul hält Zustand über mehrere Aufrufe hinweg

## Variablen des Aufrufers im Modul

```powershell
# ScopeSample.psm1
function Get-Limit { "Modul sieht Limit = [$Limit]" }
```

<div class="fragment" data-fragment-index="1">

```powershell
function Invoke-Check { $Limit = 555; Get-Limit }
Invoke-Check           # Modul sieht Limit = []

$global:Limit = 100
Get-Limit              # Modul sieht Limit = [100]
```

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Lokale Variablen des Aufrufers sieht das Modul nicht, globale schon 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Was die Funktion braucht, kommt über Parameter herein 

<div class="warn fragment" data-fragment-index="4">

Auch ein im aufrufenden Skript gesetztes `$ErrorActionPreference` gilt in der Modulfunktion nicht. Im Modul wirkt der globale Wert oder ein `-ErrorAction` am Aufruf.

## Aufbau mit `Public\` und `Private\`

<div class="columns">

<div class="column" style="width: 38%">

```text
LogTools\
  LogTools.psd1
  LogTools.psm1
  Public\
    Get-LogEntry.ps1
    Get-LogSummary.ps1
  Private\
    ConvertTo-LogLevel.ps1
```

</div>

<div class="column" style="width: 62%">

```powershell
$public  = @(Get-ChildItem "$PSScriptRoot\Public\*.ps1")
$private = @(Get-ChildItem "$PSScriptRoot\Private\*.ps1")

foreach ($file in $public + $private) {
    . $file.FullName
}

Export-ModuleMember -Function $public.BaseName
```

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Eine Datei je Funktion, der Dateiname ist der Funktionsname 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Dot-Sourcing im `.psm1` lädt alle Funktionen in den Scope des Moduls

## Manifest mit `New-ModuleManifest`

```powershell
$manifest = @{
    Path                 = '.\LogTools\LogTools.psd1'
    RootModule           = 'LogTools.psm1'
    ModuleVersion        = '0.1.0'
    FunctionsToExport    = 'Get-LogEntry', 'Get-LogSummary'
    PowerShellVersion    = '5.1'
    CompatiblePSEditions = 'Desktop', 'Core'
}
New-ModuleManifest @manifest
Test-ModuleManifest .\LogTools\LogTools.psd1
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Das Manifest (`.psd1`) ist eine Datendatei mit Version, Abhängigkeiten und Exporten; importiert wird danach die `.psd1` 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`RootModule`: das `.psm1`, das beim Import geladen wird 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`PowerShellVersion`: Mindestversion für den Import 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->`CompatiblePSEditions`: `Desktop` für 5.1, `Core` ab 6; bei eigenen Modulen nicht ausgewertet

- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`.psm1` und Manifest filtern nacheinander: Das Manifest kann nur einschränken

## Zahlen und Zeitstempel mit Kulturangabe parsen

```powershell
$de = [cultureinfo]::GetCultureInfo('de-DE')

$value = [double]::Parse('1234,56', 'Float', $de)
$time  = [datetime]::ParseExact('23.11.2026 00:15',
             'dd.MM.yyyy HH:mm', [cultureinfo]::InvariantCulture)
$value -gt 1000           # True
$time.ToString('s')       # 2026-11-23T00:15:00
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Kultur und Format stehen im Aufruf: Das Ergebnis hängt nicht von Rechner und Sitzung ab 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`[double]::Parse('1234.56', $de)` ergibt 123456: In `de-DE` ist der Punkt das Tausendertrennzeichen. Mit `'Float'` wird daraus ein Fehler 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Ein `[datetime]`- oder `[double]`-Parameter einer eigenen Funktion wandelt Text wie ein Cast um
</div>

## Casts und Rundung

```powershell

[int]2.5             # 2       zur geraden Zahl gerundet
[int]3.5             # 4
[int]'abc'           # Fehler: InvalidCastFromStringToInteger
'abc' -as [int]      # $null, kein Fehler
[bool]'False'        # True    jeder nicht leere Text
[double]''           # 0       ein leeres Feld wird zur Zahl
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Ein Cast vor dem Wert wandelt einmal um; `[int]$count = '42'` bindet den Typ an die Variable 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Kaufmännisch runden: `[math]::Round(2.5, [MidpointRounding]::AwayFromZero)` ergibt 3 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`7 / 2` ergibt einen `[double]`, ebenso `[int]::MaxValue + 1`

## `$null` in Größenvergleichen

$value -lt 0
$value -gt 0
$value -eq 0

```text
True
False
False
```

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Eine Prüfung auf negative Werte trifft deshalb auch fehlende Werte

<div class="columns">

## Arrays, `@()` und Entrollen

```powershell
$files = Get-ChildItem .\messwerte\*.csv      # eine Datei im Ordner
$files.GetType().Name                         # FileInfo
@($files).GetType().Name                      # Object[]

function Get-Device { return @('G-1001') }
(Get-Device).GetType().Name                   # String
@(Get-Device).Count                           # 1
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Je nach Trefferzahl liefert ein Befehl nichts, ein Objekt oder ein Array; `@()` macht daraus immer ein Array 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Funktionen entrollen Arrays: Die Elemente kommen einzeln an, ein Array mit einem Element als einzelnes Objekt; `return ,$array` hält es zusammen 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`$a[0..-2]` läuft rückwärts herum: Auf `0..9` liefert es `0, 9, 8`

<p class="eyebrow">Teil I · Refresher Grundlagen</p>

## Arrays, `+=` und `List[T]`

```powershell
$values = @()
foreach ($i in 1..10000) { $values += $i }      # kopiert jedes Mal
$values = foreach ($i in 1..10000) { $i }       # Ausgabe zuweisen
$list = [System.Collections.Generic.List[double]]::new()
$list.Add(1234.56)                              # wächst ohne Kopie
```

<div class="fragment" data-fragment-index="1">

| 10 000 Elemente | `+=` | Ausgabe zuweisen |
|---|---|---|
| Windows PowerShell 5.1 | 1141 bis 1500 ms | 3 bis 4 ms |
| PowerShell 7.6.9 | 40 bis 52 ms | 1 ms |

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Arrays haben eine feste Größe: `+=` legt ein neues an und kopiert alles 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->PowerShell 7.5 hat `+=` beschleunigt, die Ausgabe zuzuweisen bleibt in beiden Versionen am schnellsten 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->`List[T]` ist eine .NET-Liste für Elemente vom Typ `T`: `Add()` hängt an, ohne das Ganze zu kopieren

</div>

## Hashtables und `[ordered]`

```powershell
$devices = [ordered]@{ Nord = 15; Sued = 12; West = 9; Ost = 14 }
$devices.Keys -join ', '          # Nord, Sued, West, Ost

$status = @{ 'G-1042' = 0 }
if ($status['G-1042']) { 'vorhanden' } else { 'fehlt' }
$status.ContainsKey('G-1042')
```

<div class="fragment" data-fragment-index="1">

Die `if`-Zeile meldet `fehlt`, `ContainsKey()` liefert `True`.

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Die Reihenfolge einer Hashtable ist nicht festgelegt, `[ordered]` behält die Einfügereihenfolge 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`[ordered]` steht direkt vor dem Literal `@{}`; ein Cast nach `[hashtable]` verliert die Reihenfolge 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->`ContainsKey()` prüft den Schlüssel; die Werte `0`, `''` und `$false` zählen in `if` als nicht vorhanden
</div>

## Enums

```powershell
enum LogLevel { Info; Warn; Error }

[LogLevel]'Warn'                          # Warn
[int][LogLevel]::Error                    # 2
[LogLevel]::Warn -lt [LogLevel]::Error    # True
function Write-ImportLog {
    param([LogLevel]$Level, [string]$Message)
    '[{0,-5}] {1}' -f "$Level".ToUpper(), $Message
}
Write-ImportLog -Level Warn -Message 'Wert fehlt: Geraet=G-1042'
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Ein Enum-Parameter nimmt Label, Zahl oder Enum-Wert an 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Ohne Wertangabe hat das erste Label den Wert 0, jedes weitere eins mehr 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`[Flags()]` braucht Zweierpotenzen; prüfen mit `HasFlag()` oder `-band`

## Klassen lesen

```powershell
enum LogLevel { Info; Warn; Error }

class LogEntry {
    [datetime]$Timestamp
    [LogLevel]$Level
    [string]$Message

    LogEntry([string]$line) {
        $this.Timestamp = [datetime]$line.Substring(0, 19)
        $this.Level     = [LogLevel]$line.Substring(25, 5).Trim()
        $this.Message   = $line.Substring(32)
    }
    [bool] IsProblem() { return $this.Level -ge [LogLevel]::Warn }
}
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Ein Logeintrag als Klasse: Der Konstruktor zerlegt die Logzeile 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Eigenschaften mit Typ: Jede Zuweisung wird umgewandelt oder abgelehnt 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Der Konstruktor heißt wie die Klasse, `$this` ist die Instanz 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Methoden nennen ihren Rückgabetyp und liefern nur, was hinter `return` steht
</div>

$entry = [LogEntry]::new($line)       # Konstruktor aufrufen

$entry.Level                          # Warn
$entry.IsProblem()                    # True
$entry.Level = 'Error'                # Text wird zu LogLevel
$entry | Get-Member -MemberType Property
```

## Fehlerarten

| Art | Beispiel | Danach | `catch` |
|---|---|---|---|
| non-terminating | `Write-Error`, die meisten Cmdlet-Fehler | nächstes Objekt | nein |
| statement-terminating | `1/0`, `[int]'abc'` | nächste Anweisung | ja |
| script-terminating | `throw`, `-ErrorAction Stop` | Abbruch des Skripts | ja |

<div class="fragment" data-fragment-index="1">

```powershell
Get-Item .\messwerte\fehlt.csv, .\messwerte\Nord_2026-11-23.csv
```

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Der Fehler für die erste Datei wird gemeldet, die zweite Datei kommt trotzdem 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Fehler stehen zusätzlich in `$Error`, der neueste in `$Error[0]`
</div>

## `-ErrorAction` und `$ErrorActionPreference`

| | `-ErrorAction` | `$ErrorActionPreference` |
|---|---|---|
| gilt für | einen Aufruf | den Scope und seine Kind-Scopes |
| non-terminating | ja | ja |
| statement-terminating | nein | ja |

<div class="fragment" data-fragment-index="1">

```powershell
& {
    $ErrorActionPreference = 'SilentlyContinue'
    1/0                    # statement-terminating, unterdrückt
    'läuft weiter'
}
```

</div>

<div class="warn fragment" data-fragment-index="2">

An einer Advanced Function setzt `-ErrorAction` ein lokales `$ErrorActionPreference`. `-ErrorAction SilentlyContinue` schluckt dort auch ein `throw` im Rumpf.

</div>

<div class="quelle fragment" data-fragment-index="3">

Quelle: Microsoft Learn, about_Preference_Variables und about_Throw

</div>
</div>

## `try`, `catch`, `finally`

```powershell
$path = '.\messwerte\Nord_2026-11-22.csv'      # fehlt
try {
    $text = Get-Content $path -ErrorAction Stop
}
catch [System.Management.Automation.ItemNotFoundException] {
    Write-Warning "Datei fehlt: $($_.TargetObject)"
}
catch {
    Write-Warning "Unerwartet: $($_.Exception.Message)"
}
finally {
    'läuft immer'
}
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Hier greift der erste `catch`: Warnung mit dem Pfad der fehlenden Datei, danach gibt `finally` seinen Text aus 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Ohne `-ErrorAction Stop` läuft `try` weiter, `catch` bleibt unberührt 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Im `catch` ist `$_` der `ErrorRecord`: `Exception`, `CategoryInfo`, `InvocationInfo` 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Spezifische Typen vor dem allgemeinen `catch`; `finally` läuft auch bei `exit`
</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Qualität beim Schreiben**: PSScriptAnalyzer (prüft Skripte gegen Regeln), Formatierung, Einstellungen

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Go to Definition** (<span class="kbd">F12</span>) springt zur Stelle, an der ein Befehl oder eine Variable definiert ist; **Find All References** (<span class="kbd">Umschalt</span>+<span class="kbd">F12</span>) listet alle Stellen, die sie benutzen 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**PSScriptAnalyzer** prüft das Skript beim Schreiben gegen Regeln; die Befunde stehen in der Ansicht **Problems** 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Extension Terminal**: die integrierte Konsole, mit der Editor und Debugger zusammenarbeiten

```powershell
$path = '.\daten\messwerte\Nord_2026-11-23.csv'
$rows = Import-Csv $path -Delimiter ';'

$rows | Where-Object Status -ne 'OK' |
    Select-Object Zeitstempel, Geraet, Status
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" --><span class="kbd">F8</span> führt die markierten Zeilen im Extension Terminal aus, ohne Markierung die aktuelle Zeile 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" --><span class="kbd">F5</span> startet die ganze Datei im Debugger; ohne Haltepunkt läuft sie durch 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Beide arbeiten in derselben Sitzung: `$rows` steht danach im Terminal bereit

Ein Skript, das nur läuft, weil eine Variable aus einem früheren Lauf noch in der Sitzung steht, scheitert in einer frischen Sitzung. Vor der Abgabe einmal nach einem Neustart der Sitzung ausführen.

## Debugger: Lauf anhalten und schrittweise ausführen

```powershell
param($Path = '.\daten\messwerte\Nord_2026-11-23.csv')

$total = 0
foreach ($row in Import-Csv $Path -Delimiter ';') {
    $total += [double]::Parse($row.Wert, [cultureinfo]'de-DE')
}
"Summe: $total"
```

Fehlt in der Datei ein Wert, meldet Zeile 5 einen Fehler, und die Summe erscheint trotzdem.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Haltepunkt: Klick links neben die Zeilennummer, Start mit <span class="kbd">F5</span> 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Schrittweise: **Step Over**, **Step Into** (in die Funktion), **Step Out** (heraus) 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Continue** (<span class="kbd">F5</span>) läuft bis zum nächsten Haltepunkt, **Stop** (<span class="kbd">Umschalt</span>+<span class="kbd">F5</span>) beendet den Lauf
</div>

## Bedingte Haltepunkte

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Rechtsklick links neben die Zeile: **Add Conditional Breakpoint** 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Expression**: Der Lauf hält nur, wenn der Ausdruck wahr ist, zum Beispiel `$row.Status -ne 'OK'` 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Hit Count**: Der Lauf hält erst nach einer Zahl von Durchläufen 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Logpoint**: schreibt eine Meldung, ohne anzuhalten, sofern der Debugger das unterstützt

}
Set-PSBreakpoint -Variable total -Mode Write

```json

    "powershell.codeFormatting.useCorrectCasing": true,
    "powershell.codeFormatting.autoCorrectAliases": true,
    "powershell.pester.useLegacyCodeLens": false,
    "[powershell]": {

    }
}
```

## Abschnitt 2: Skripte versionieren mit Git

Git hält jede Änderung an Skripten und Modulen fest: frühere Stände wiederherstellen, parallel arbeiten, Änderungen zusammenführen.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Drei Bereiche**: Arbeitsverzeichnis, Staging-Bereich, Repository 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Grundzyklus**: `status`, `add`, `commit`, dazu `diff` und `log` 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Inhalt des Repositorys**: `.gitignore`, keine Secrets 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Branch und Merge**: parallel arbeiten, Konflikte lösen 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Remote** (das Repository auf dem Server): `clone`, `push`, `fetch`, `pull` 
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->**Zusammenarbeit**: Merge Request in GitLab, Git im Terminal und im Editor
</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Repository**: alle Commits mit Vorgänger, Autor, Zeit und Nachricht 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Remote**: die Kopie auf dem Server; erst `git push` überträgt dorthin

## `git init` und `git clone`

```bash
git init -b main            # neues Repository im aktuellen Ordner
# oder: vorhandenes Repository vom Server holen
git clone https://gitlab.example.com/team/measurement-tools.git

git config user.name  "Vorname Nachname"
git config user.email "vorname.nachname@example.com"
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`init` legt den Ordner `.git` an: Das Repository liegt im Projektordner selbst 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`clone` lädt alle Commits und Branches und richtet den Server als Remote `origin` ein 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`user.name` und `user.email` stehen als Autor in jedem Commit 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Issues und Merge Requests liegen auf dem Server, nicht im Repository
</div>

## `git status`, `git add`, `git commit`

```bash
git status --short
git add MeasurementTools/Public/Test-Measurement.ps1
git commit -m "Ersatzwert gilt als gültiger Status"
```

<div class="columns">

<div class="column" style="width: 50%">

Vor `git add`:

```text
 M MeasurementTools/Public/Test-Measurement.ps1
?? coverage.xml
?? testResults.xml
```

</div>

<div class="column" style="width: 50%">

Nach `git add`:

```text
M  MeasurementTools/Public/Test-Measurement.ps1
?? coverage.xml
?? testResults.xml
```

</div>

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Spalte 1: Staging-Bereich gegenüber dem letzten Commit; Spalte 2: Arbeitsverzeichnis gegenüber dem Staging-Bereich 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`M` heißt geändert (modified): `git add` rückt es von Spalte 2 nach Spalte 1, die Änderung ist vorgemerkt 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`??` heißt: Git verfolgt die Datei nicht 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->`commit` speichert genau das Vorgemerkte, hier eine Datei; die Nachricht sagt, was sich ändert
</div>

## Branch und Merge

```bash
git switch -c feature/summary-tests   # Branch anlegen und wechseln
git commit -m "Test für Get-MeasurementSummary"
git switch main
git merge feature/summary-tests
```

<div class="fragment" data-fragment-index="1">

```text
*   dcb698e Merge branch 'feature/summary-tests'
|\  
| * 3be3939 Test für Get-MeasurementSummary
* | ac29e02 README ergänzt
|/  
* 7998a82 Testergebnisse und lokale Daten ignorieren
```

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Ein Branch ist ein Name, der auf einen Commit zeigt; ein zweiter Projektordner entsteht nicht 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Haben beide Seiten neue Commits, entsteht ein Merge-Commit mit zwei Vorgängern 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Hat `main` keine eigenen neuen Commits, rückt der Name nur vor: Fast-forward
</div>

                $reasons.Add('Status ungültig')
=======

>>>>>>> feature/status-text

## Remote: `push`, `fetch`, `pull`

```bash
git push -u origin feature/summary-tests   # Branch zum Server
git fetch                                  # Stand des Servers holen
git log --oneline HEAD..origin/main        # was ist dort neu?
git pull --ff-only                         # main nachziehen
```

<div class="fragment" data-fragment-index="1">

```text
b486589 Merge branch 'feature/readme-beispiel' into 'main'
eeaf4bd README: Beispielaufruf
Updating 567c580..b486589
Fast-forward
 README.md | 4 ++++
 1 file changed, 4 insertions(+)
```

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`push -u` legt den Branch auf dem Server an und verknüpft ihn mit dem lokalen 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`fetch` ändert nur `origin/main`, die lokale Kopie des Serverstands; `pull` baut ihn ein 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->`--ff-only` bricht ab, wenn der lokale `main` eigene Commits hat

## Abschnitt 3: Skripttests schreiben mit Pester

Pester ist das Testframework für PowerShell: Ein Test ruft eine Funktion mit bekannten Eingaben auf und vergleicht das Ergebnis mit dem erwarteten.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Testdatei**: `*.Tests.ps1`, `Describe`, `Context`, `It`, `Should` 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Vorbereiten und aufräumen**: `BeforeAll`, `BeforeEach`, `AfterAll` 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Zwei Phasen**: Discovery und Run 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Testdaten**: `-ForEach`, `-TestCases`, `TestDrive:` 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Abhängigkeiten ersetzen**: `Mock`, `Should -Invoke`, `InModuleScope` 
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->**Auswerten**: Code Coverage, `New-PesterConfiguration`, Testbericht

## Aufbau einer Testdatei

```powershell
BeforeAll {
    Import-Module "$PSScriptRoot/../MeasurementTools" -Force
}

Describe 'Test-Measurement' {
    It 'lässt einen plausiblen Wert gelten' {
        $item = [pscustomobject]@{ Value = 12.5; Status = 'OK' }
        ($item | Test-Measurement).IsValid | Should -BeTrue
    }
    It 'meldet einen fehlenden Wert' {
        $item = [pscustomobject]@{ Value = $null; Status = 'OK' }
        ($item | Test-Measurement).Reason | Should -Be 'Wert fehlt'
    }
}
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Dateiname `*.Tests.ps1`: Pester sucht nach dieser Endung 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`Describe` gruppiert, `It` ist ein Test, `Should` prüft das Ergebnis 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`BeforeAll` lädt das Modul, bevor der erste Test läuft
</div>

## `Should`-Operatoren

```powershell
$result.Reason      | Should -Be 'Wert fehlt; Status nicht OK'
$rows[0].Status     | Should -BeExactly 'OK'
$result.IsValid     | Should -BeFalse
$rows[2].Value      | Should -BeNullOrEmpty
$rows               | Should -HaveCount 3
$rows.Status        | Should -Contain 'Gestoert'
$rows[0].DeviceId   | Should -Match '^G-\d{4}$'
$rows[0].Timestamp  | Should -BeOfType [datetime]
$rows[0].Value      | Should -Not -BeNullOrEmpty
{ Import-MeasurementFile .\fehlt.csv -ErrorAction Stop } |
    Should -Throw
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`Should` steht am Ende einer Pipeline und prüft, was von links ankommt: `$rows` sind drei eingelesene Zeilen, `$result` ist das Prüfergebnis der dritten 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`-Be` vergleicht ohne Rücksicht auf Groß- und Kleinschreibung, `-BeExactly` mit 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`-Not` kehrt jeden Operator um; `-Because 'Grund'` ergänzt die Fehlermeldung 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->`-Throw` braucht einen Skriptblock und einen Fehler, der abbricht

## `BeforeAll`, `BeforeEach`, `AfterAll`

```powershell
Describe 'Import-MeasurementFile' {
    BeforeAll {                       # einmal für den Block
        Import-Module "$PSScriptRoot/../MeasurementTools" -Force
        $sample = "$PSScriptRoot/testdaten/Nord_2026-11-23.csv"
    }
    BeforeEach {                      # vor jedem It
        $rows = @(Import-MeasurementFile -Path $sample)
    }

    It 'liefert je Zeile ein Objekt' { $rows | Should -HaveCount 3 }
    It 'liest Dezimalzahlen' { $rows[0].Value | Should -Be 1234.56 }
}
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Variablen aus beiden Blöcken sind im `It` lesbar, jedes `It` hat eigenen Scope 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`AfterAll` und `AfterEach` räumen auf, auch nach einem fehlgeschlagenen Test 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`Context` gruppiert wie `Describe` und kann eigene `BeforeAll` haben

```powershell

## `Mock` und `Should -Invoke`

```powershell
function Get-ImportServerStatus {
    param([string[]]$ComputerName)
    foreach ($name in $ComputerName) {
        $reachable = Test-Connection $name -Count 1 -Quiet
        [pscustomobject]@{ Server = $name; Reachable = $reachable }
    }
}
```

<div class="fragment" data-fragment-index="1">

```powershell
It 'fragt jeden Server genau einmal ab' {
    Mock Test-Connection { $true }
    $status = Get-ImportServerStatus 'IMP-NORD-01', 'IMP-SUED-01'
    $status.Reachable | Should -Be $true, $true
    Should -Invoke Test-Connection -Times 2 -Exactly
}
```

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`Mock` ersetzt einen Befehl im Test durch einen Skriptblock: kein Netz, kein Server nötig 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`Should -Invoke` prüft, ob und wie oft der ersetzte Befehl aufgerufen wurde

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Idee**: Jede Änderung wird auf dem Server automatisch analysiert und getestet, bei jedem Push und für alle im Team gleich 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Aufbau**: `.gitlab-ci.yml` beschreibt die Pipeline aus Stufen und Jobs, ein Container-Image liefert PowerShell 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Erfolg und Fehler**: Der Exitcode entscheidet 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Analyse**: PSScriptAnalyzer mit eigenem Regelsatz 
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Tests**: Pester mit Testbericht und Coverage 
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->**Qualitätsschranke**: Merge Request, danach der Ausblick auf die Auslieferung

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Job**: Befehle, die ein **Runner** ausführt, mit Erfolg oder Fehler am Ende 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Stage** (Stufe) ordnet die Jobs; nach einem Fehler startet die nächste nicht

## `.gitlab-ci.yml`: Stufen und Jobs

```yaml
stages: [analyze, test]

analyze:
  stage: analyze
  script:
    - pwsh -NoProfile -File ci/Invoke-Analysis.ps1

test:
  stage: test
  script:
    - pwsh -NoProfile -File ci/Invoke-Tests.ps1
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`.gitlab-ci.yml` im Stamm des Repositorys: Jeder Push startet eine Pipeline für den Commit 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`analyze` und `test` sind Jobs, die Namen sind frei; `stage` ordnet jeden Job einer Stufe zu 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`stages` legt die Reihenfolge der Stufen fest: Scheitert `analyze`, startet `test` nicht 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->`script` ruft Skripte aus dem Repository auf, die lokal genauso laufen

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`reports:junit` liest den Bericht von Pester: GitLab zeigt die Tests in der Pipeline und im Merge Request 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`when: always` lädt die Datei auch hoch, wenn Tests fehlschlagen 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`paths` macht die Datei zusätzlich als Download am Job verfügbar

```yaml

  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
```

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->GitLab zeigt den Prozentwert am Job und im Merge Request 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`coverage_report` liest `coverage.xml` und markiert im Diff des Merge Requests getestete und ungetestete Zeilen

## Coverage-Schwelle in der Pipeline

```powershell
$config.Run.PassThru = $true
$config.CodeCoverage.CoveragePercentTarget = 70
$result = Invoke-Pester -Configuration $config
if ($result.Result -ne 'Passed') {
    throw "$($result.FailedCount) Tests sind rot."
}
$coverage = $result.CodeCoverage
if ($coverage.CoveragePercent -lt $coverage.CoveragePercentTarget) {
    throw 'Coverage liegt unter dem Zielwert.'
}
```

<div class="fragment" data-fragment-index="1">

```text
Covered 47,96% / 70%. 98 analyzed Commands in 5 Files.
```

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`Run.PassThru` liefert das Ergebnisobjekt, das Skript entscheidet selbst über Erfolg und Fehler 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Pester setzt den Zielwert nicht durch: Erst der Vergleich mit `throw` lässt den Job scheitern
</div>

## Merge Request als Qualitätsschranke

| Im Merge Request sichtbar | Kommt aus |
|---|---|
| Status der Pipeline für den letzten Commit | Jobs `analyze` und `test` |
| Test summary: neu fehlgeschlagene Tests | `artifacts:reports:junit` |
| Coverage in Prozent | Schlüsselwort `coverage` |
| Markierte Zeilen im Diff | `coverage_report` |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Projekteinstellung **Pipelines must succeed**: Der Merge ist erst bei erfolgreicher Pipeline möglich 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Geschützter Branch `main`: kein direkter Push, Änderungen kommen nur über Merge Requests 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Review und Freigabe bleiben eigene Schritte neben der Pipeline

## Ausblick: Auslieferung als Paket

```yaml
publish:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - pwsh -NoProfile -File ci/Publish-Module.ps1
  artifacts:
    paths:
      - dist/
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Dritte Stufe `publish`: Wegen `if: $CI_COMMIT_TAG` läuft der Job nur für ein Git-Tag, also einen benannten Commit wie `v0.1.0`, nach erfolgreicher Analyse und bestandenen Tests 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Das Skript packt den Modulordner als ZIP nach `dist/`, die Version kommt aus dem Manifest 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`artifacts` hebt `dist/` als **Job-Artefakt** auf: gehört zu dieser Pipeline, ist für Zwischenergebnisse gedacht und läuft ab 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Für die Auslieferung: **Package Registry** von GitLab, versionierte Pakete mit fester Adresse für andere Projekte und Rechner

## Statische Methoden für Zahl, Datum, Pfad und Dauer

```powershell
$de = [cultureinfo] 'de-DE'
$value = [double]::Parse('1234,56', $de)           # double: 1234,56
$stamp = [datetime]::ParseExact('23.11.2026 00:15',
    'dd.MM.yyyy HH:mm', $de)
$stamp.AddMinutes(15).ToString('HH:mm')            # 00:30
$parsed = 0.0
[double]::TryParse('', 'Float', $de, [ref]$parsed) # False
$file = 'Nord_2026-11-23.csv'
[IO.Path]::GetFileNameWithoutExtension($file)      # Nord_2026-11-23
[timespan]::FromMinutes(15).TotalSeconds           # 900
$watch = [System.Diagnostics.Stopwatch]::StartNew()
$watch.Elapsed.TotalMilliseconds                   # Dauer bisher
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`Parse` wirft bei ungültigem Text; `TryParse` meldet `True` oder `False` und schreibt die Zahl in die Variable hinter `[ref]` 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`ParseExact` nimmt genau ein Format an: Tag und Monat werden nicht geraten 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Die Kultur ist ein Argument des Aufrufs: Das Skript rechnet auf jedem Rechner gleich 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->`[IO.Path]` arbeitet nur mit dem Text des Pfads; `Stopwatch` misst eine Dauer
</div>

</script></section><section data-separator="?

## Generische Typen

```powershell
$values = [System.Collections.Generic.List[double]]::new()
$values.Add(1234.56)
$values.Add('1236.02')        # Text wird zu double
$values.Add('kWh')            # Fehler: kein double

$seen = [System.Collections.Generic.HashSet[datetime]]::new()
$seen.Add([datetime] '2026-11-23 00:15')     # True

```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Der Typparameter steht in eckigen Klammern: `List[double]`, `HashSet[datetime]`, `Dictionary[string, double]` 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Die Sammlung prüft und konvertiert bei jedem `Add` 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`HashSet.Add()` gibt `True` oder `False` zurück: in Funktionen auffangen, sonst landet es in der Ausgabe 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->`Dictionary[string, double]` unterscheidet Groß- und Kleinschreibung der Schlüssel, eine Hashtable nicht

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Enge Schleifen** über sehr viele Elemente: C# rechnet dort deutlich schneller als eine PowerShell-Schleife

- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Windows-API**: Funktionen ohne Cmdlet und ohne .NET-Klasse, erreichbar über P/Invoke (Platform Invoke) 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Interfaces**: PowerShell kann keine definieren, C# schon

**Der Preis:** eine zweite Sprache im Skript, Compilerfehler statt PowerShell-Fehlern und in jeder Sitzung einmal die Zeit fürs Übersetzen. Im Modus `ConstrainedLanguage` lädt `Add-Type` nur signierte Assemblies, keinen C#-Quelltext.

## `Add-Type -TypeDefinition`: eine C#-Klasse

```csharp
using System;

namespace Course {
    public static class GapFinder {
        public static int CountGaps(DateTime[] times, int minutes) {
            int gaps = 0;
            for (int i = 1; i < times.Length; i++) {
                TimeSpan gap = times[i] - times[i - 1];
                if (gap.TotalMinutes > minutes) gaps++;
            }
            return gaps;
        }
    }
}
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`Add-Type -TypeDefinition` übersetzt diesen C#-Text zu einem .NET-Typ, der Lücken zählt 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Der C#-Quelltext steht als Here-String `@' … '@` im Skript oder in einer `.cs`-Datei 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Nur was `public` ist, sehen Sie aus PowerShell 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Immer mit `namespace`, sonst kann der Typ einen vorhandenen Namen verdecken

<div class="merk">

**Regel:** Ein per `Add-Type` geladener Typ bleibt bis zum Ende der Sitzung, wie er ist. Er lässt sich weder ändern noch entladen.

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Typname und Namespace sind in einer Sitzung eindeutig 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Gleicher Quelltext noch einmal: `Add-Type` kompiliert nicht neu, keine Meldung 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Geänderter Quelltext, gleicher Typname: Fehler, der alte Typ gilt weiter

<div class="tipp fragment" data-fragment-index="5">

**Ausweg:** neue Sitzung starten oder im Kindprozess testen (`pwsh -NoProfile -File .\skript.ps1`). Die Abfrage `if (-not ('Course.GapFinder' -as [type])) { Add-Type … }` nimmt nur die Meldung weg.

namespace Course {

class Device {

```powershell
class Device {
    [string] $Id
    [Nullable[double]] $Total
    Device([string] $id) { $this.Init($id) }
    Device([string] $id, [double] $total) {
        $this.Init($id)
        $this.Total = $total
    }
    hidden [void] Init([string] $id) { $this.Id = $id }
}
[Device]::new                             # beide Überladungen

```

```powershell
class Device {
    [string] $Id = 'G-1042'
    [Nullable[double]] $Total

    [bool] IsPlausible() {
        'Prüfung läuft'                   # wird verworfen
        return ($null -ne $this.Total) -and ($this.Total -ge 0)
    }
    [void] Add([double] $amount) {
        $this.Total = $this.Total + $amount
    }
}
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Methoden nennen ihren Rückgabetyp; ohne Angabe gilt `[void]` 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Zurück geht nur, was hinter `return` steht: Lose Ausdrücke verschwinden 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Eigenschaften nur über `$this.`, Variablen von außen nur mit `$script:`

## `hidden` und `static`

```powershell
class Device {
    [string] $Id
    [Nullable[double]] $Total
    hidden [string] $SourceLine
    static [cultureinfo] $Culture = [cultureinfo] 'de-DE'
    static [Device] Parse([string] $line) {
        $p = $line.Split(';')
        $d = [Device]@{ Id = $p[0]; SourceLine = $line }
        $provider = [Device]::Culture
        if ($p[2]) { $d.Total = [double]::Parse($p[2], $provider) }
        return $d
    }
}
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`static`: gehört zur Klasse, Aufruf `[Device]::Parse(…)`, kein `$this` 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`hidden`: fehlt in Ausgabe und `Get-Member`, bleibt aber von außen erreichbar 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->`ConvertTo-Json` schreibt versteckte Eigenschaften trotzdem mit

## Vererbung und `base`

```powershell
class SubDevice : Device {
    [string] $ParentId
    SubDevice([string] $id, [double] $total, [string] $parentId)
        : base($id, $total) {
        $this.ParentId = $parentId
    }
    [bool] IsPlausible() {
        return ([Device] $this).IsPlausible() -and $this.ParentId
    }
}
$s = [SubDevice]::new('G-1042', 1239.10, 'G-1031')
$s -is [Device]            # True
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`SubDevice` (ein Unterzähler) erbt `Id` und `Total` von `Device`, ergänzt `ParentId` und verschärft `IsPlausible()` 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Genau eine Basisklasse; `: base(…)` reicht Argumente an ihren Konstruktor weiter 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Basismethode aufrufen: `([Device] $this).IsPlausible()` 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Jede Methode lässt sich überschreiben; `private` und `sealed` gibt es nicht

## Interfaces implementieren, `ToString()` überschreiben

```powershell
class Device : System.IComparable {
    [string] $Id
    [string] $Site
    [int] CompareTo([object] $other) {
        return $this.Site.CompareTo($other.Site)
    }
    [string] ToString() {
        return '{0} ({1})' -f $this.Id, $this.Site
    }
}
$a = [Device]@{ Id = 'G-1042'; Site = 'West' }
$b = [Device]@{ Id = 'G-1043'; Site = 'Nord' }
"$($a, $b | Sort-Object)"            # G-1043 (Nord) G-1042 (West)
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Interfaces stehen hinter dem Doppelpunkt; jede ihrer Methoden muss vorhanden sein 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`IComparable` trägt `Sort-Object`, `-gt`, `-lt` und `Measure-Object -Maximum`

```powershell
enum MeasurementStatus { OK; Ersatzwert; Gestoert }

    [string] $DeviceId
    [MeasurementStatus] $Status

```powershell

    MissingValue   = 1
    NegativeValue  = 2
    Gap            = 4
    DuplicateStamp = 8

$found.HasFlag([Finding]::Gap)             # True
[Finding] 'NegativeValue, DuplicateStamp'  # aus Text

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->`Import-Module` und `#Requires -Modules` bringen Funktionen, Aliase und Variablen, **keine Klassen und Enums** 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`using module` lädt das Modul **und** macht seine Typen in der Datei bekannt

## `using module`: Regeln

```powershell
using module MeasurementTools      # erste Anweisung der Datei

$row = Import-MeasurementFile .\Nord_2026-11-23.csv |
    Select-Object -First 1
$row -is [Measurement]                    # True
$row.Status -eq [MeasurementStatus]::OK   # True
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Dritte Form neben `using namespace` und `using assembly`: steht vor allen anderen Anweisungen; Modulname oder Pfad ohne Variablen wie `$PSScriptRoot` 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Sichtbar werden nur Klassen, die **direkt in der Root-Datei** des Moduls (`.psm1`) stehen 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Per Dot-Sourcing nachgeladene Klassen bleiben für den Aufrufer unsichtbar 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->In VS Code sorgt erst die `using module`-Zeile für Vervollständigung der eigenen Typen

## Geänderte Klassen in derselben Sitzung

| Schritt in einer Sitzung | `[Measurement]` im Skript | Funktion im Modul |
|---|---|---|
| Skript mit `using module` läuft | Version A | Version A |
| Klasse in der `.psm1` geändert, Skript läuft erneut | Version A | Version A |
| `Import-Module -Force`, Skript läuft erneut | Version A | Version B |
| neue Sitzung, Skript läuft | Version B | Version B |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Klassen und Enums eines Moduls lassen sich in der Sitzung weder entladen noch neu laden 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->`Import-Module -Force` lädt das Modul neu, der Typ im Skript bleibt der alte: Danach arbeiten zwei Fassungen der Klasse nebeneinander 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Nach jeder Änderung an einer Klasse: neue Sitzung, Tests im Kindprozess

## Klasse oder `[pscustomobject]`

| | `[pscustomobject]` | PowerShell-Klasse | C#-Typ über `Add-Type` |
|---|---|---|---|
| Typprüfung der Werte | nein | ja | ja |
| Methoden, Konstruktoren | Methoden über `Add-Member`, keine Konstruktoren | ja | ja |
| als Parametertyp | `[PSTypeName('…')]` | `[Measurement]` | `[Course.Reading]` |
| Aufwand | eine Zeile | Klasse, im Modul `using module` | zweite Sprache |
| ändern in der Sitzung | jederzeit | neue Sitzung | neue Sitzung |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**`[pscustomobject]`**: Ausgabeobjekte von Funktionen, für Pipeline, Export und Formatierung 
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Klasse**: Werte mit Regeln, Verhalten, ein Typ für mehrere Funktionen 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**C#-Typ**: Tempo, Interfaces, vorhandener Code

        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const match = normalizedColor.match(/(\d+), (\d+), (\d+)/);
            if (!match) return false;
            const [, c_r, c_g, c_b] = match;

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');
        } else {
